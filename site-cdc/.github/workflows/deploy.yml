# Nome do workflow
name: Deploy to GitHub Pages

on:
  # Corre sempre que você der 'push' para a branch 'main'
  push:
    branches: [ "main" ] 
  
  # Permite que você corra este workflow manualmente
  workflow_dispatch:

# Permissões necessárias
permissions:
  contents: read
  pages: write
  id-token: write

# Configuração do trabalho (job)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: site-cdc/package-lock.json # Caminho corrigido

      - name: Install dependencies
        # Entra na pasta site-cdc e instala
        run: cd site-cdc && npm install 
      
      - name: Build
        # Entra na pasta site-cdc e constrói
        run: cd site-cdc && npm run build 
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Caminho corrigido para a pasta dist
          path: ./site-cdc/dist 

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4